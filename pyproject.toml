[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevgnss-paper"
version = "1.0.0"
description = "Reproducibility package for Jev-guided GNSS observation weighting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2,<4", "torch>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

